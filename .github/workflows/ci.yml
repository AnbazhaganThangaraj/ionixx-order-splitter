name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    needs: quality
    env:
      API_KEY: ci-smoke-test-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ionixx-order-splitter:ci .
      - name: Production mode refuses to start without API keys
        run: |
          if docker run --rm ionixx-order-splitter:ci; then
            echo "expected startup to fail without API_KEYS"; exit 1
          fi
      - name: Start container
        run: |
          docker run -d --name app -p 3000:3000 \
            -e API_KEYS="ci:${API_KEY}" ionixx-order-splitter:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/health/ready && exit 0
            sleep 1
          done
          docker logs app; exit 1
      - name: Smoke test the API
        run: |
          set -e
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/orders)" = "401"
          curl -fsS -X POST http://localhost:3000/api/v1/orders \
            -H "X-API-Key: ${API_KEY}" -H 'Content-Type: application/json' \
            -d '{"orderType":"BUY","totalAmount":"100","portfolio":[{"symbol":"AAPL","allocation":"60"},{"symbol":"TSLA","allocation":"40"}]}' \
            | tee /dev/stderr | grep -q '"quantity":"0.600"'
          test "$(docker inspect --format '{{.Config.User}}' ionixx-order-splitter:ci)" = "node"
      - name: Container logs
        if: always()
        run: docker logs app || true
